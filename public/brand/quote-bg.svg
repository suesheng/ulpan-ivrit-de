<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="qb-base" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#0a3d6b"/>
      <stop offset="45%" stop-color="#1760a6"/>
      <stop offset="100%" stop-color="#3b96d0"/>
    </linearGradient>
    <radialGradient id="qb-a" cx="70%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1760a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="qb-b" cx="22%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#5aafe0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0a3d6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="qb-c" cx="50%" cy="75%" r="45%">
