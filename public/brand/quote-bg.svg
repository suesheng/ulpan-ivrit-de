  <rect width="1200" height="520" fill="url(#qb-b)"/>
  <rect width="1200" height="520" fill="url(#qb-c)"/>

  <ellipse cx="960" cy="140" rx="260" ry="160" fill="#ffffff" opacity="0.1" filter="url(#qb-soft)"/>
  <ellipse cx="240" cy="260" rx="300" ry="180" fill="#6eb8e8" opacity="0.16" filter="url(#qb-soft)"/>
